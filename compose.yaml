---
name: dev-oremi-isakoso

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    restart: always
    ports:
      - 61883:1883
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    ports:
      - "6274:6274"
      - "6277:6277"
    environment:
      HOST: 0.0.0.0
      MCP_AUTO_OPEN_ENABLED: "false"
...
